# MeshCore Gateway — docker-compose voor LOKAAL bouwen/testen.
#
# Voor productie op Portainer: gebruik portainer-stack.yml (pullt het image
# dat GitHub Actions naar GHCR pusht, bouwt niets).
#
# Eerste keer:  docker compose up -d --build
# Daarna:       docker compose up -d        (na code-wijziging: --build)
# Logs:         docker compose logs -f
# Stop:         docker compose down
#
# USB-passthrough werkt op Linux/Pi via 'devices'. Op macOS/Windows NIET —
# Docker Desktop draait in een VM die geen host-USB doorgeeft.

services:
  gateway:
    build: .
    image: meshcore-gateway:dev
    container_name: meshcore-gateway-dev
    restart: unless-stopped

    ports:
      - "8080:8080"   # Web UI (host:container)

    devices:
      # Pas aan naar wat 'ls /dev/ttyACM* /dev/ttyUSB*' op de host toont.
      - "/dev/ttyACM0:/dev/ttyACM0"

    # GID van de groep waar het device van is (Debian/Pi: dialout = 20).
    group_add:
      - "20"

    volumes:
      - ./data:/data  # SQLite-DB: ./data/meshcore.db

    environment:
      MESHCORE_PORT: /dev/ttyACM0
      # MESHCORE_WEB_PORT: "8080"
      # MESHCORE_DEBUG: "1"
      # Kloksync met de companion (v1.1.054). Defaults staan in de image;
      # zet ze hier alleen als je wilt afwijken.
      # MESHCORE_TIME_SYNC: "1"            # 0 = automatische sync uit
      # MESHCORE_TIME_SYNC_INTERVAL: "21600"   # seconden tussen controles (6u)
      # MESHCORE_TIME_SYNC_THRESHOLD: "30"     # vanaf hoeveel seconden afwijking bijstellen

    # CPU/memory limits voor een Pi (optioneel)
    # mem_limit: 512m
    # cpus: 1.0
