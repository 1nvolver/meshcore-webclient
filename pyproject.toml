[project]
name = "meshcore-gateway"
version = "0.1.0"
description = "Web/CLI gateway for a USB-attached MeshCore companion radio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.19",
    "fastapi>=0.110",
    "greenlet>=3.0",
    "jinja2>=3.1",
    "meshcore>=1.1",
    "pyserial>=3.5",
    "python-multipart>=0.0.9",
    "python-socketio>=5.11",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]
